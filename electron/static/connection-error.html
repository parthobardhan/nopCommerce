<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Can't reach the store</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #1c1e21;
        font: 16px/1.5 "Segoe UI", sans-serif;
      }
      main {
        width: min(440px, calc(100% - 48px));
        background: #fff;
        border: 1px solid #e1e3e8;
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 12px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #store-url {
        word-break: break-all;
      }
      .detail {
        color: #5c6570;
        font-size: 14px;
      }
      .hint {
        margin: 16px 0 0;
        color: #5c6570;
        font-size: 14px;
      }
      button {
        background: #1f6feb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #1f6feb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the store</h1>
      <p>Nothing is answering at</p>
      <p id="store-url" class="mono"></p>
      <p id="detail" class="detail"></p>
      <button id="retry" type="button" autofocus>Retry</button>
      <p class="hint">
        Start the store, then retry. Docker Compose publishes
        <span class="mono">http://localhost</span>. <span class="mono">dotnet run</span> without a
        launch profile uses <span class="mono">http://localhost:5000</span>.
      </p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("store-url").textContent = params.get("storeUrl") || "";
      document.getElementById("detail").textContent = params.get("detail") || "";
      document.getElementById("retry").addEventListener("click", () => {
        const shell = window.nopShell;
        if (shell && typeof shell.retry === "function") {
          shell.retry();
        }
      });
    </script>
  </body>
</html>
